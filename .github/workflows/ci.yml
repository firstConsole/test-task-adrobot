# Six jobs, one per kind of failure, so a red run says which kind without being opened.
#
# PLAN-BACKEND §11 describes six of them; `generated` is one it does not, because two of the
# files the frontend is built from — its API types and its country list — are committed here
# and generated from the backend, and only the backend can say whether they are still true.
#
# Still missing, because it cannot pass yet and a job that is allowed to fail is a job
# nobody reads:
#
#   compose-smoke   it is specified as "the literal commands from the README", and the
#                   README is written at 12.1. The stack itself already comes up; what is
#                   missing is the thing the job is supposed to be checking.

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # Two commands and not `make lint`, so the log says which of the two failed.
      - name: ruff check
        working-directory: backend
        run: poetry run ruff check .
      - name: ruff format
        working-directory: backend
        run: poetry run ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # Covers src, tests, alembic and scripts; the file list lives in pyproject.toml so
      # that this line cannot drift from what a developer runs.
      - name: mypy
        working-directory: backend
        run: poetry run mypy

  imports:
    name: imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # The three layer contracts, which no other job can see: the domain ring importing a
      # third-party package, or a use case reaching infrastructure, is a design failure that
      # type-checks and passes every test.
      - name: lint-imports
        working-directory: backend
        run: poetry run lint-imports --no-logo --no-cache

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tag compose runs, spelled the same way, because "it passed on my machine" has to
    # mean the same server. These steps run on the runner itself and not in a container, so
    # `db` is not a name here — which is why the database fixtures read TEST_DATABASE_URL and
    # not ADROBOT_DATABASE_URL.
    services:
      postgres:
        image: docker.io/library/postgres:18-trixie
        env:
          POSTGRES_USER: adrobot
          POSTGRES_PASSWORD: adrobot
          POSTGRES_DB: adrobot
        ports:
          - 5432:5432
        # `-h 127.0.0.1` rather than the default socket check, and compose's own numbers:
        # initdb runs a local server before the real one starts, so a socket `pg_isready`
        # can pass a second before the port is listening.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U adrobot -d adrobot"
          --health-interval 2s
          --health-timeout 3s
          --health-start-period 15s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # The schema the tests run against is the one the migrations produce, built the way
      # production builds it rather than from the models.
      - name: alembic upgrade head
        working-directory: backend
        env:
          ADROBOT_ENV: dev
          ADROBOT_DATABASE_URL: postgresql+asyncpg://adrobot:adrobot@127.0.0.1:5432/adrobot
          ADROBOT_ACCESS_TOKEN: ci-access-token-not-a-secret
          ADROBOT_KEITARO_BASE_URL: https://tracker.invalid/admin_api/v1
          ADROBOT_KEITARO_API_KEY: ci-not-a-real-keitaro-admin-api-key
          ADROBOT_KEITARO_PUBLIC_BASE_URL: https://tracker.invalid
        run: poetry run alembic upgrade head
      # `CI` is exported by GitHub Actions and the postgres fixture reads it: a service
      # container that never came up must fail this job rather than skip thirteen tests.
      - name: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://adrobot:adrobot@127.0.0.1:5432/adrobot
        run: poetry run pytest

  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # docs/adrobot-openapi.json is committed and the frontend generates its TypeScript
      # from it, so a request model changed without regenerating it is a frontend that
      # type-checks against an API that no longer exists.
      - name: make openapi
        run: make openapi
      - name: the committed document still matches the routers
        run: git diff --exit-code -- docs/adrobot-openapi.json
      # The geo select is built from a copy of the domain's ISO 3166-1 list. A copy that
      # drifts is a form offering a country the API then refuses.
      - name: make countries
        run: make countries
      - name: the committed country list still matches the domain
        run: git diff --exit-code -- frontend/src/shared/lib/countries.gen.ts

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # The version in .nvmrc, which is also the one the Dockerfile builds with. The two
      # paths here are relative to the repository and not to `working-directory`.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci` and not `install`: it installs the lock file and refuses a drifted manifest.
      - name: npm ci
        run: npm ci
      # The other half of the pair the `openapi` job holds: the document is current, and
      # this says the checked-in types were generated from it.
      - name: generated types are current
        run: npm run api:types:check
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test
      - name: vite build
        run: npm run build
