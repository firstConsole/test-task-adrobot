# Two hooks, because two things can be wrong in a commit that CI would otherwise catch
# minutes later or — in the second case — never.
#
# `poetry -P backend`, not `-C backend`: `-C` changes the working directory, and
# pre-commit passes paths relative to the repository root, so ruff would look for
# backend/backend/src/... and report `E902 No such file or directory` on every file.
# `-P` points poetry at the project without moving the process, and ruff finds
# backend/pyproject.toml by walking up from each file it is given.
#
# `env -u VIRTUAL_ENV` in front of it is load-bearing, not caution. `poetry run` exports
# VIRTUAL_ENV as the RELATIVE path `.venv`, so when these hooks are reached through
# `poetry run pre-commit run --all-files` — which is what a developer types before
# pushing — the inner poetry resolves it against the repository root, finds no venv
# there, decides the active environment is broken and recreates backend/.venv EMPTY.
# Measured: 126 packages to 3, on every run. Unsetting it makes `-P` the only thing that
# decides which environment is used.

repos:
  - repo: local
    hooks:
      # `language: system` against the ruff in backend/.venv, rather than
      # astral-sh/ruff-pre-commit with a `rev:`. The version is already pinned once, in
      # poetry.lock; a second pin here would drift, and the hook would enforce a rule set
      # the CI job does not have. This is why pre-commit is a dev dependency.
      - id: ruff-format
        name: ruff format
        entry: env -u VIRTUAL_ENV poetry -P backend run ruff format
        language: system
        # Without this, pre-commit hands the hook every staged file. `ruff format` formats
        # python blocks inside Markdown, and `[tool.ruff.format] exclude` does NOT apply to
        # paths passed explicitly on the command line — so README.md would be rewritten.
        types_or: [python, pyi]
        require_serial: true

      # Reports; it does not fix. `ruff check --fix` on a freshly generated migration
      # deletes `import sqlalchemy as sa` and `from alembic import op` as unused — measured
      # — which is both the loss of a deliberate signal (an empty migration is not
      # something to commit, PLAN-01 §4) and two imports the author has to type back in.
      # Formatting is mechanical and safe to automate; a lint fix is a judgement call.
      - id: ruff-check
        name: ruff check
        entry: env -u VIRTUAL_ENV poetry -P backend run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

  # A Go binary with no Python to share, so this one is pinned by `rev` and pre-commit
  # fetches it. It scans the diff, which is what makes it useful here: the two assets
  # PLAN-BACKEND §9 protects are a tracker admin key and a shared token, and both are
  # meant to live only in an untracked .env.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
