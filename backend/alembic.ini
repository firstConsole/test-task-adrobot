# Alembic, reduced to what this project actually configures here.
#
# There is no `sqlalchemy.url`: alembic/env.py reads ADROBOT_DATABASE_URL through
# `Settings`, so one name reads the database in this project and a password is never
# written into a committed file. There are no `[loggers]` sections either — env.py calls
# `configure_logging`, because the migrator runs as a container beside the api and a stack
# that emits JSON on one service and `INFO  [alembic]` on another cannot be read by
# anything.

[alembic]
script_location = %(here)s/alembic

# Migrations are numbered, not hashed: `0001_core`, `0002_drafts`, `0003_catalogue`.
# The number comes from `alembic revision --rev-id 0001 -m "..."`, which the Makefile
# target wraps; this line is what turns it into the file name.
file_template = %%(rev)s_%%(slug)s
